<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgReact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="reactorKettle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgReact)"/>

  <!-- Chemical Reactor Vessel with Motor Agitator -->
  <rect x="100" y="70" width="140" height="150" rx="8" fill="url(#reactorKettle)"/>
  <ellipse cx="170" cy="70" rx="70" ry="20" fill="#7e22ce"/>
  <!-- Top Agitator Drive Motor -->
  <rect x="150" y="20" width="40" height="50" rx="3" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <line x1="170" y1="70" x2="170" y2="180" stroke="#f8fafc" stroke-width="4"/>
  <!-- Agitator Blades -->
  <line x1="140" y1="180" x2="200" y2="180" stroke="#f8fafc" stroke-width="4"/>

  <!-- Chemical Storage Drum Racks & Manifold -->
  <g fill="#334155" stroke="#64748b" stroke-width="1.5">
    <rect x="280" y="70" width="80" height="150" rx="4"/>
    <rect x="380" y="70" width="80" height="150" rx="4"/>
    <rect x="480" y="70" width="80" height="150" rx="4"/>
  </g>

  <!-- High-Precision Digital Dosing Manifold Lines -->
  <path d="M 170 120 L 280 120 M 360 120 L 380 120 M 460 120 L 480 120" stroke="#c084fc" stroke-width="6"/>

  <!-- Title Badge -->
  <rect x="20" y="250" width="290" height="34" rx="4" fill="#0c0717" opacity="0.95" stroke="#7e22ce" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#c084fc"/>
  <text x="50" y="271" fill="#faf5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Chemical Reactor Kettles &amp; Thinners</text>
</svg>
