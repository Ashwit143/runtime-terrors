<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPellet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="pelletWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgPellet)"/>

  <!-- Ring Die Pellet Extrusion Mill -->
  <circle cx="170" cy="130" r="75" fill="#1f2937" stroke="#4ade80" stroke-width="3"/>
  <circle cx="170" cy="130" r="45" fill="#374151" stroke="#22c55e" stroke-width="2"/>
  <circle cx="145" cy="130" r="18" fill="#4b5563"/>
  <circle cx="195" cy="130" r="18" fill="#4b5563"/>

  <!-- High-Pressure Feed Conditioning Hopper -->
  <polygon points="110,20 230,20 190,70 150,70" fill="#374151" stroke="#9ca3af" stroke-width="2"/>

  <!-- Biomass Pellets Extruding Out -->
  <g fill="url(#pelletWood)" stroke="#713f12" stroke-width="1">
    <rect x="255" y="110" width="20" height="8" rx="2"/>
    <rect x="270" y="125" width="20" height="8" rx="2"/>
    <rect x="285" y="115" width="20" height="8" rx="2"/>
    <rect x="260" y="140" width="20" height="8" rx="2"/>
    <rect x="290" y="135" width="20" height="8" rx="2"/>
    <rect x="310" y="120" width="20" height="8" rx="2"/>
  </g>

  <!-- Vibrating Cooling & Screening Sieve -->
  <polygon points="320,130 550,180 540,240 310,190" fill="#1f2937" stroke="#6b7280" stroke-width="2"/>
  <line x1="325" y1="160" x2="545" y2="210" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Bulk Bio-Pellet Storage Hopper -->
  <path d="M 440 30 L 560 30 L 520 100 L 480 100 Z" fill="#374151" stroke="#9ca3af" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="20" y="250" width="290" height="34" rx="4" fill="#022c22" opacity="0.95" stroke="#16a34a" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#4ade80"/>
  <text x="50" y="271" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Ring-Die Industrial Biomass Pellet Mill</text>
</svg>
