<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="alum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="furnaceGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgMetal)"/>

  <!-- Smelting Furnace Background -->
  <rect x="420" y="40" width="140" height="180" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="450" y="110" width="80" height="70" rx="4" fill="url(#furnaceGlow)"/>
  <circle cx="490" cy="145" r="22" fill="#fef08a" opacity="0.8"/>
  <rect x="470" y="20" width="40" height="30" fill="#475569" rx="2"/>

  <!-- Bundles of Aluminium 6063 Extrusion Profiles -->
  <g fill="url(#alum)" stroke="#475569" stroke-width="1.5">
    <!-- Stack 1: T-Slot and Hollow Box Extrusions -->
    <rect x="50" y="150" width="320" height="22" rx="2"/>
    <rect x="50" y="174" width="320" height="22" rx="2"/>
    <rect x="50" y="198" width="320" height="22" rx="2"/>
    <rect x="50" y="222" width="320" height="22" rx="2"/>
    
    <!-- Cross Sections showing 6063 Extrusion Profiles -->
    <rect x="50" y="150" width="28" height="22" fill="#64748b"/>
    <rect x="56" y="156" width="16" height="10" fill="#0f172a"/>
    <rect x="50" y="174" width="28" height="22" fill="#64748b"/>
    <rect x="56" y="180" width="16" height="10" fill="#0f172a"/>
    <rect x="50" y="198" width="28" height="22" fill="#64748b"/>
    <rect x="56" y="204" width="16" height="10" fill="#0f172a"/>
    <rect x="50" y="222" width="28" height="22" fill="#64748b"/>
    <rect x="56" y="228" width="16" height="10" fill="#0f172a"/>

    <!-- Stack 2: Angled Offcuts and Billets -->
    <rect x="110" y="110" width="230" height="18" rx="2"/>
    <rect x="110" y="130" width="230" height="18" rx="2"/>
    <polygon points="110,110 90,128 90,148 110,130" fill="#94a3b8"/>

    <!-- Round Extrusion Logs / Billets -->
    <circle cx="80" cy="115" r="16" fill="url(#alum)"/>
    <circle cx="80" cy="115" r="12" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Heavy Duty Crane Hook & Cables -->
  <line x1="220" y1="0" x2="220" y2="80" stroke="#f59e0b" stroke-width="4"/>
  <path d="M 210 80 L 230 80 L 225 100 C 225 110 215 110 215 100 Z" fill="#f59e0b"/>

  <!-- Title Badge -->
  <rect x="20" y="250" width="280" height="34" rx="4" fill="#090d16" opacity="0.95" stroke="#475569" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#f59e0b"/>
  <text x="50" y="271" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Aluminium 6063 Extrusion &amp; Scrap</text>
</svg>
