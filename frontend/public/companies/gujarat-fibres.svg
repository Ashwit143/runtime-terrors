<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFibres" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="filaments" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgFibres)"/>

  <!-- High-Precision Extruder Spinneret Head -->
  <rect x="80" y="30" width="440" height="30" rx="3" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="100" y="60" width="400" height="12" fill="#94a3b8"/>
  
  <!-- Thousands of Extruded Polyester Micro-Filaments Showering Down -->
  <g stroke="url(#filaments)" stroke-width="1.5" opacity="0.85">
    <line x1="120" y1="72" x2="160" y2="210"/>
    <line x1="140" y1="72" x2="175" y2="210"/>
    <line x1="160" y1="72" x2="190" y2="210"/>
    <line x1="180" y1="72" x2="205" y2="210"/>
    <line x1="200" y1="72" x2="220" y2="210"/>
    <line x1="220" y1="72" x2="235" y2="210"/>
    <line x1="240" y1="72" x2="250" y2="210"/>
    <line x1="260" y1="72" x2="265" y2="210"/>
    <line x1="280" y1="72" x2="280" y2="210"/>
    <line x1="300" y1="72" x2="295" y2="210"/>
    <line x1="320" y1="72" x2="310" y2="210"/>
    <line x1="340" y1="72" x2="325" y2="210"/>
    <line x1="360" y1="72" x2="340" y2="210"/>
    <line x1="380" y1="72" x2="355" y2="210"/>
    <line x1="400" y1="72" x2="370" y2="210"/>
    <line x1="420" y1="72" x2="385" y2="210"/>
    <line x1="440" y1="72" x2="400" y2="210"/>
    <line x1="460" y1="72" x2="415" y2="210"/>
    <line x1="480" y1="72" x2="430" y2="210"/>
  </g>

  <!-- Filament Quenching Chamber & Drawing Godet Rollers -->
  <circle cx="280" cy="210" r="26" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="340" cy="210" r="26" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="400" cy="210" r="26" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Hydraulic Fiber Baling Press -->
  <rect x="460" y="140" width="90" height="90" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="475" y="160" width="60" height="50" rx="2" fill="#f8fafc"/>
  <!-- Bale Strapping Bands -->
  <line x1="475" y1="175" x2="535" y2="175" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="475" y1="195" x2="535" y2="195" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="20" y="250" width="290" height="34" rx="4" fill="#080e1a" opacity="0.95" stroke="#1e3a8a" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#60a5fa"/>
  <text x="50" y="271" fill="#eff6ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Polyester Staple Fiber (PSF) Spinning</text>
</svg>
