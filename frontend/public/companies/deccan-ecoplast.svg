<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGran" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="drumBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="granuleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgGran)"/>

  <!-- High-Torque Heavy Duty Shredder Hopper -->
  <polygon points="120,40 280,40 240,140 160,140" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="150" y="140" width="100" height="70" rx="3" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  
  <!-- Counter-Rotating Rotary Shredder Blades -->
  <circle cx="180" cy="175" r="18" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="220" cy="175" r="18" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 180 160 L 180 190 M 165 175 L 195 175" stroke="#f8fafc" stroke-width="2"/>
  <path d="M 220 160 L 220 190 M 205 175 L 235 175" stroke="#f8fafc" stroke-width="2"/>

  <!-- Blue 200L HDPE Drums Feeding into Shredder -->
  <g fill="url(#drumBlue)" stroke="#172554" stroke-width="1.5">
    <rect x="140" y="20" width="40" height="55" rx="4" transform="rotate(-20, 140, 20)"/>
    <rect x="190" y="15" width="40" height="55" rx="4" transform="rotate(15, 190, 15)"/>
    <!-- Intact Drums Staged on Floor -->
    <rect x="50" y="180" width="35" height="55" rx="3"/>
    <rect x="75" y="185" width="35" height="55" rx="3"/>
  </g>

  <!-- Granulator Cyclone & Pellet Discharge Bin -->
  <rect x="330" y="50" width="80" height="110" rx="4" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
  <polygon points="330,160 410,160 370,210" fill="#0f766e"/>
  <rect x="340" y="210" width="60" height="40" rx="3" fill="#334155" stroke="#64748b" stroke-width="2"/>

  <!-- HDPE Regrind Granules Cascade -->
  <g fill="url(#granuleGlow)">
    <circle cx="370" cy="190" r="3"/>
    <circle cx="365" cy="200" r="3.5"/>
    <circle cx="375" cy="202" r="3"/>
    <circle cx="368" cy="215" r="4"/>
    <circle cx="360" cy="225" r="3"/>
    <circle cx="380" cy="228" r="3.5"/>
    <circle cx="355" cy="235" r="4"/>
    <circle cx="372" cy="238" r="3"/>
    <circle cx="385" cy="240" r="3"/>
  </g>

  <!-- Extruder Barrel & Cooling Water Bath -->
  <rect x="420" y="170" width="130" height="24" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="440" y="200" width="110" height="28" rx="2" fill="#0369a1" opacity="0.6"/>

  <!-- Title Badge -->
  <rect x="20" y="250" width="280" height="34" rx="4" fill="#022c22" opacity="0.95" stroke="#0f766e" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#14b8a6"/>
  <text x="50" y="271" fill="#f0fdfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HDPE Drum Shredder &amp; Granulator</text>
</svg>
