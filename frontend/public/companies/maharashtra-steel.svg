<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="glowingBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="furnaceCrucible" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgSteel)"/>

  <!-- Steel Induction Melting Furnace -->
  <rect x="60" y="50" width="130" height="150" rx="6" fill="#27272a" stroke="#71717a" stroke-width="2"/>
  <ellipse cx="125" cy="65" rx="50" ry="20" fill="url(#furnaceCrucible)"/>
  <!-- Induction Coils -->
  <line x1="50" y1="90" x2="200" y2="90" stroke="#f59e0b" stroke-width="6"/>
  <line x1="50" y1="120" x2="200" y2="120" stroke="#f59e0b" stroke-width="6"/>
  <line x1="50" y1="150" x2="200" y2="150" stroke="#f59e0b" stroke-width="6"/>

  <!-- Continuous Steel Re-Rolling Mill Stands -->
  <g fill="#3f3f46" stroke="#a1a1aa" stroke-width="2">
    <!-- Stand 1 -->
    <rect x="230" y="80" width="30" height="120" rx="3"/>
    <circle cx="245" cy="115" r="14" fill="#18181b"/>
    <circle cx="245" cy="155" r="14" fill="#18181b"/>
    <!-- Stand 2 -->
    <rect x="310" y="80" width="30" height="120" rx="3"/>
    <circle cx="325" cy="120" r="12" fill="#18181b"/>
    <circle cx="325" cy="150" r="12" fill="#18181b"/>
    <!-- Stand 3 -->
    <rect x="390" y="80" width="30" height="120" rx="3"/>
    <circle cx="405" cy="125" r="10" fill="#18181b"/>
    <circle cx="405" cy="145" r="10" fill="#18181b"/>
  </g>

  <!-- Glowing Hot TMT Steel Billet passing through stands -->
  <line x1="125" y1="135" x2="570" y2="135" stroke="url(#glowingBar)" stroke-width="8" stroke-linecap="round"/>

  <!-- Cooling Bed Grid with Ribbed Steel Re-bars -->
  <g stroke="#71717a" stroke-width="3">
    <line x1="440" y1="180" x2="570" y2="180"/>
    <line x1="440" y1="195" x2="570" y2="195"/>
    <line x1="440" y1="210" x2="570" y2="210"/>
    <line x1="440" y1="225" x2="570" y2="225"/>
  </g>

  <!-- Title Badge -->
  <rect x="20" y="250" width="290" height="34" rx="4" fill="#09090b" opacity="0.95" stroke="#ef4444" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#f97316"/>
  <text x="50" y="271" fill="#fef2f2" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Induction Furnace &amp; TMT Rolling Mill</text>
</svg>
