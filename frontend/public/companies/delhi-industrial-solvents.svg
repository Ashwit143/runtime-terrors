<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="columnSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="solventLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgChem)"/>

  <!-- Fractional Distillation Column 1 (Tall) -->
  <rect x="100" y="30" width="50" height="200" rx="6" fill="url(#columnSteel)"/>
  <ellipse cx="125" cy="30" rx="25" ry="8" fill="#a8a29e"/>
  <!-- Distillation Trays / Rings -->
  <line x1="100" y1="60" x2="150" y2="60" stroke="#44403c" stroke-width="2"/>
  <line x1="100" y1="90" x2="150" y2="90" stroke="#44403c" stroke-width="2"/>
  <line x1="100" y1="120" x2="150" y2="120" stroke="#44403c" stroke-width="2"/>
  <line x1="100" y1="150" x2="150" y2="150" stroke="#44403c" stroke-width="2"/>
  <line x1="100" y1="180" x2="150" y2="180" stroke="#44403c" stroke-width="2"/>
  <line x1="100" y1="210" x2="150" y2="210" stroke="#44403c" stroke-width="2"/>

  <!-- Fractional Distillation Column 2 -->
  <rect x="180" y="60" width="60" height="170" rx="6" fill="url(#columnSteel)"/>
  <ellipse cx="210" cy="60" rx="30" ry="10" fill="#a8a29e"/>
  <line x1="180" y1="95" x2="240" y2="95" stroke="#44403c" stroke-width="2"/>
  <line x1="180" y1="130" x2="240" y2="130" stroke="#44403c" stroke-width="2"/>
  <line x1="180" y1="165" x2="240" y2="165" stroke="#44403c" stroke-width="2"/>
  <line x1="180" y1="200" x2="240" y2="200" stroke="#44403c" stroke-width="2"/>

  <!-- Spherical Pressurized Chemical Tanks -->
  <circle cx="340" cy="140" r="55" fill="url(#columnSteel)"/>
  <circle cx="340" cy="140" r="50" fill="#292524" opacity="0.6"/>
  <rect x="335" y="195" width="10" height="35" fill="#57534e"/>

  <circle cx="470" cy="140" r="55" fill="url(#columnSteel)"/>
  <circle cx="470" cy="140" r="50" fill="#292524" opacity="0.6"/>
  <rect x="465" y="195" width="10" height="35" fill="#57534e"/>

  <!-- Complex Interconnected Process Piping -->
  <path d="M 125 30 L 125 15 L 210 15 L 210 60" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <path d="M 210 130 L 290 130 L 290 140 L 340 140" fill="none" stroke="#e7e5e4" stroke-width="6"/>
  <path d="M 340 140 L 415 140 L 415 140 L 470 140" fill="none" stroke="#e7e5e4" stroke-width="6"/>
  <!-- Sight Glass with Amber Solvent Flow -->
  <rect x="250" y="122" width="24" height="16" rx="2" fill="url(#solventLiquid)" stroke="#e7e5e4" stroke-width="2"/>

  <!-- Safety Hazmat Warning Diamond -->
  <polygon points="530,70 545,55 560,70 545,85" fill="#dc2626"/>
  <polygon points="530,70 545,85 530,100 515,85" fill="#3b82f6"/>
  <polygon points="560,70 575,85 560,100 545,85" fill="#f59e0b"/>
  <polygon points="545,85 560,100 545,115 530,100" fill="#f8fafc"/>

  <!-- Title Badge -->
  <rect x="20" y="250" width="290" height="34" rx="4" fill="#0c0a09" opacity="0.95" stroke="#78716c" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#f59e0b"/>
  <text x="50" y="271" fill="#fafaf9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Chemical Fractional Distillation Columns</text>
</svg>
