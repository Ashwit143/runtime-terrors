<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="conveyor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="petFlakes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <!-- Industrial Wash Tanks & Cyclones -->
  <rect x="40" y="50" width="110" height="180" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" opacity="0.8"/>
  <rect x="60" y="30" width="70" height="20" rx="3" fill="#38bdf8" opacity="0.3"/>
  <circle cx="95" cy="110" r="30" fill="#0369a1" opacity="0.5"/>
  <path d="M 95 60 L 95 230" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  
  <rect x="170" y="70" width="90" height="160" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <polygon points="170,230 260,230 215,270" fill="#0284c7" opacity="0.6"/>

  <!-- Overhead Pipes & Manifolds -->
  <path d="M 40 40 L 560 40 L 560 120" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <path d="M 95 40 L 95 50" fill="none" stroke="#38bdf8" stroke-width="8"/>
  <path d="M 215 40 L 215 70" fill="none" stroke="#38bdf8" stroke-width="8"/>

  <!-- High-Speed Flake Sorting Conveyor -->
  <polygon points="260,190 560,140 560,210 260,260" fill="url(#conveyor)"/>
  <line x1="260" y1="225" x2="560" y2="175" stroke="#94a3b8" stroke-width="3"/>
  
  <!-- Optical Sorting Hood -->
  <rect x="360" y="90" width="100" height="60" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="380" y1="150" x2="380" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="410" y1="150" x2="410" y2="165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="440" y1="150" x2="440" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- PET Bottle Flakes Scattered on Conveyor -->
  <g fill="url(#petFlakes)" opacity="0.9">
    <polygon points="280,220 295,215 290,228 275,225"/>
    <polygon points="310,210 325,208 320,218 305,216"/>
    <polygon points="340,200 358,195 352,208 335,205"/>
    <polygon points="370,190 385,188 380,198 365,195"/>
    <polygon points="400,182 418,178 412,189 395,186"/>
    <polygon points="430,175 445,170 440,182 425,180"/>
    <polygon points="460,168 478,162 472,175 455,172"/>
    <polygon points="490,160 508,155 502,168 485,165"/>
    <polygon points="520,152 538,148 532,159 515,156"/>
    <!-- Second stream layer -->
    <polygon points="300,235 315,230 310,242 295,240"/>
    <polygon points="360,215 375,210 370,222 355,220"/>
    <polygon points="420,195 435,190 430,202 415,200"/>
    <polygon points="480,178 495,172 490,185 475,182"/>
  </g>

  <!-- Facility Title Overlay -->
  <rect x="20" y="250" width="260" height="34" rx="4" fill="#0b0f19" opacity="0.9" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#38bdf8"/>
  <text x="50" y="271" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PET Flake Washing &amp; Sorting</text>
</svg>
