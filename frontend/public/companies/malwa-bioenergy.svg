<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWarehouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="strawBale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgWarehouse)"/>

  <!-- Steel Truss Warehouse Ceiling -->
  <line x1="0" y1="30" x2="600" y2="30" stroke="#78716c" stroke-width="8"/>
  <path d="M 0 30 L 100 80 L 200 30 L 300 80 L 400 30 L 500 80 L 600 30" fill="none" stroke="#57534e" stroke-width="3"/>
  <line x1="100" y1="80" x2="100" y2="30" stroke="#57534e" stroke-width="2"/>
  <line x1="300" y1="80" x2="300" y2="30" stroke="#57534e" stroke-width="2"/>
  <line x1="500" y1="80" x2="500" y2="30" stroke="#57534e" stroke-width="2"/>

  <!-- High-Density Stacked Rectangular Straw Bales -->
  <g fill="url(#strawBale)" stroke="#713f12" stroke-width="1.5">
    <!-- Bottom Row Bales -->
    <rect x="60" y="190" width="90" height="45" rx="2"/>
    <rect x="155" y="190" width="90" height="45" rx="2"/>
    <rect x="250" y="190" width="90" height="45" rx="2"/>
    <rect x="345" y="190" width="90" height="45" rx="2"/>
    <rect x="440" y="190" width="90" height="45" rx="2"/>

    <!-- Middle Row Bales (Interlocked) -->
    <rect x="105" y="140" width="90" height="45" rx="2"/>
    <rect x="200" y="140" width="90" height="45" rx="2"/>
    <rect x="295" y="140" width="90" height="45" rx="2"/>
    <rect x="390" y="140" width="90" height="45" rx="2"/>

    <!-- Top Row Bales -->
    <rect x="150" y="90" width="90" height="45" rx="2"/>
    <rect x="245" y="90" width="90" height="45" rx="2"/>
    <rect x="340" y="90" width="90" height="45" rx="2"/>

    <!-- Peak Bale -->
    <rect x="245" y="40" width="90" height="45" rx="2"/>
  </g>

  <!-- Bale Twine / Strapping Lines -->
  <g stroke="#451a03" stroke-width="1.2" stroke-dasharray="3,2">
    <line x1="85" y1="190" x2="85" y2="235"/>
    <line x1="125" y1="190" x2="125" y2="235"/>
    <line x1="180" y1="190" x2="180" y2="235"/>
    <line x1="220" y1="190" x2="220" y2="235"/>
    <line x1="275" y1="190" x2="275" y2="235"/>
    <line x1="315" y1="190" x2="315" y2="235"/>
    
    <line x1="130" y1="140" x2="130" y2="185"/>
    <line x1="170" y1="140" x2="170" y2="185"/>
    <line x1="225" y1="140" x2="225" y2="185"/>
    <line x1="265" y1="140" x2="265" y2="185"/>
    <line x1="320" y1="140" x2="320" y2="185"/>
    <line x1="360" y1="140" x2="360" y2="185"/>
  </g>

  <!-- Industrial Forklift & Bale Clamp -->
  <rect x="490" y="180" width="60" height="55" rx="4" fill="#ea580c"/>
  <circle cx="510" cy="240" r="12" fill="#1c1917" stroke="#78716c" stroke-width="3"/>
  <circle cx="545" cy="240" r="10" fill="#1c1917" stroke="#78716c" stroke-width="3"/>
  <rect x="470" y="160" width="8" height="65" fill="#57534e"/>
  <rect x="445" y="190" width="30" height="6" fill="#78716c"/>

  <!-- Title Badge -->
  <rect x="20" y="250" width="280" height="34" rx="4" fill="#0c0a09" opacity="0.95" stroke="#a16207" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#eab308"/>
  <text x="50" y="271" fill="#fefce8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Paddy Straw Biomass Bales Depot</text>
</svg>
