<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgFab)"/>

  <!-- CNC Gantry Bridge -->
  <rect x="50" y="30" width="500" height="26" rx="3" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <rect x="220" y="56" width="60" height="70" rx="4" fill="#3f3f46" stroke="#a1a1aa" stroke-width="2"/>
  <polygon points="235,126 265,126 255,150 245,150" fill="#71717a"/>
  
  <!-- Laser Cutting Head & Focused Beam -->
  <line x1="250" y1="150" x2="250" y2="185" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="250" cy="185" r="18" fill="url(#sparkGlow)"/>

  <!-- Sparks Flying from Laser Piercing -->
  <path d="M 250 185 L 220 160 M 250 185 L 285 155 M 250 185 L 290 195 M 250 185 L 210 200 M 250 185 L 265 215 M 250 185 L 235 220" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>

  <!-- Sheet Metal Bed with CNC Cutout Skeleton -->
  <rect x="70" y="185" width="460" height="65" rx="3" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Cutout Pattern showing industrial structural offcuts -->
  <g fill="#0f172a" stroke="#1e293b" stroke-width="2">
    <circle cx="110" cy="215" r="16"/>
    <circle cx="160" cy="215" r="16"/>
    <rect x="290" y="200" width="40" height="30" rx="3"/>
    <rect x="350" y="200" width="50" height="30" rx="3"/>
    <rect x="420" y="200" width="60" height="30" rx="3"/>
  </g>

  <!-- Heavy Steel Beams & Offcut Stacks -->
  <polygon points="440,80 550,80 530,150 420,150" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <line x1="440" y1="100" x2="550" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="125" x2="540" y2="125" stroke="#94a3b8" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="20" y="250" width="280" height="34" rx="4" fill="#09090b" opacity="0.95" stroke="#52525b" stroke-width="1"/>
  <circle cx="36" cy="267" r="5" fill="#38bdf8"/>
  <text x="50" y="271" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CNC Fiber Laser Cutting &amp; Steel Fab</text>
</svg>
